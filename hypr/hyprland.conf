################
### MONITORS ###
################

source = ~/.config/hypr/monitors.conf
# monitor = eDP-1, 2880x1920@120, 1920x0, 1.6

###################
### MY PROGRAMS ###
###################

$terminal = ghostty
$fileManager = dolphin
$lockscreen = hyprlock
$browser = helium
$discord = flatpak run com.discordapp.Discord

#################
### AUTOSTART ###
#################

exec-once = /usr/libexec/pam_kwallet_init

# hyprland stuff
exec-once = hyprpaper & waybar & swaync & hypridle
# exec-once = systemctl --user start hyprpolkitagent
exec-once = /usr/libexec/kf6/polkit-kde-authentication-agent-1
exec-once = /home/eden/.config/hypr/scripts/monitor_connect.sh

# non essentials programs
exec-once = flatpak run org.signal.Signal
exec-once = [workspace 4 silent] $discord
exec-once = [workspace 3 silent] $browser
# exec-once = bitwarden
exec-once = vicinae server

#####################
### LOOK AND FEEL ###
#####################

# Cursor
env = XCURSOR_SIZE,24
env = XCURSOR_THEME,adwaita
env = HYPRCURSOR_SIZE,24
env = HYPRCURSOR_THEME,adwaita

layerrule = match:namespace ^selection$, no_anim on

# Blur for swaync
layerrule = match:namespace ^swaync-control-center$, blur on, ignore_alpha 0.5
layerrule = match:namespace ^swaync-notification-window$, blur on, ignore_alpha 0.5

# Vicinae
layerrule = match:namespace ^vicinae$, blur on, ignore_alpha 0

# QT
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
# env = QT_STYLE_OVERRIDE,kvantum
env = QT_QPA_PLATFORMTHEME,qt6ct
# env = QT_QPA_PLATFORMTHEME,qt5ct

env = GDK_BACKEND,wayland,x11,*
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland

env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# electron
env = ELECTRON_OZONE_PLATFORM_HINT,wayland

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 1

    col.active_border = rgb(808080) rgb(808080) rgb(808080) rgb(808080) 45deg
    col.inactive_border = rgb(171717) rgb(171717) rgb(171717) rgb(171717) 45deg
    resize_on_border = true
    allow_tearing = false
    layout = dwindle

}

decoration {
    rounding = 8

    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 3
        passes = 1

        vibrancy = 0.1696

        new_optimizations = true
    }
}

animations {
    enabled = true

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, almostLinear, fade
    animation = workspacesIn, 1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = true
}

#############
### INPUT ###
#############

input {
    kb_layout = fr
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0

    touchpad {
        natural_scroll = true
    }
}

device {
    name = pixa3854:00-093a:0274-touchpad # trackpad
    sensitivity = 0.25
}

###################
### KEYBINDINGS ###
###################

$mainMod = SUPER # Sets "Windows" key as main modifier

bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, L, exec, $lockscreen
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, F, togglefloating,
bind = $mainMod, Space, exec, vicinae toggle
bind = $mainMod, P, exec, hyprpicker -a
bind = $mainMod, C, exec, swaync-client -t -sw
bind = Ctrl, Escape, exec, killall waybar || waybar
bind = , PRINT, exec, hyprshot -zx -m window -o ~/Pictures/screenshots
bind = $mainMod SHIFT, S, exec, hyprshot -z -m region -o ~/Pictures/screenshots
bind = $mainMod, V, exec, vicinae vicinae://launch/clipboard/history
bind = $mainMod, comma, exec, vicinae vicinae://launch/core/search-emojis

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod, Tab, workspace, e+1
bind = $mainMod SHIFT, Tab, workspace, e-1

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, ampersand, workspace, 1
bind = $mainMod, eacute, workspace, 2
bind = $mainMod, quotedbl, workspace, 3
bind = $mainMod, apostrophe, workspace, 4
bind = $mainMod, parenleft, workspace, 5
bind = $mainMod, minus, workspace, 6
bind = $mainMod, egrave, workspace, 7
bind = $mainMod, underscore, workspace, 8
bind = $mainMod, ccedilla, workspace, 9
bind = $mainMod, agrave, workspace, 10
bind = $mainMod, parenright, workspace, 11
bind = $mainMod, equal, workspace, 12

# Switch workspaces with CTRL + mainMod 
bind = $mainMod CTRL, ampersand, workspace, 5
bind = $mainMod CTRL, eacute, workspace, 6
bind = $mainMod CTRL, quotedbl, workspace, 7
bind = $mainMod CTRL, apostrophe, workspace, 8
bind = $mainMod CTRL, ccedilla, workspace, 9
bind = $mainMod CTRL, agrave, workspace, 10
bind = $mainMod CTRL, parenright, workspace, 11
bind = $mainMod CTRL, equal, workspace, 12

bind = $mainMod CTRL SHIFT, ampersand, movetoworkspace, 5
bind = $mainMod CTRL SHIFT, eacute, movetoworkspace, 6
bind = $mainMod CTRL SHIFT, quotedbl, movetoworkspace, 7
bind = $mainMod CTRL SHIFT, apostrophe, movetoworkspace, 8
bind = $mainMod CTRL SHIFT, parenleft, movetoworkspace, 9
bind = $mainMod CTRL SHIFT, minus, movetoworkspace, 10
bind = $mainMod CTRL SHIFT, egrave, movetoworkspace, 11
bind = $mainMod CTRL SHIFT, underscore, movetoworkspace, 12

# Move active window to a workspace with mainMod + SHIFT + [0-+]
bind = $mainMod SHIFT, ampersand, movetoworkspace, 1
bind = $mainMod SHIFT, eacute, movetoworkspace, 2
bind = $mainMod SHIFT, quotedbl, movetoworkspace, 3
bind = $mainMod SHIFT, apostrophe, movetoworkspace, 4
bind = $mainMod SHIFT, parenleft, movetoworkspace, 5
bind = $mainMod SHIFT, minus, movetoworkspace, 6
bind = $mainMod SHIFT, egrave, movetoworkspace, 7
bind = $mainMod SHIFT, underscore, movetoworkspace, 8
bind = $mainMod SHIFT, ccedilla, movetoworkspace, 9
bind = $mainMod SHIFT, agrave, movetoworkspace, 10
bind = $mainMod SHIFT, parenright, movetoworkspace, 11
bind = $mainMod SHIFT, equal, movetoworkspace, 12

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Resize windows with kb
bind = $mainMod SHIFT, right, resizeactive, 80 0
bind = $mainMod SHIFT, left, resizeactive, -80 0
bind = $mainMod SHIFT, up, resizeactive, 0 -80
bind = $mainMod SHIFT, down, resizeactive, 0 80

# Move windows with kb
bind = $mainMod CTRL, left, movewindow, l
bind = $mainMod CTRL, right, movewindow, r
bind = $mainMod CTRL, up, movewindow, u
bind = $mainMod CTRL, down,  movewindow, d

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 5%-

bindl = ,XF86AudioNext, exec, playerctl next
bindl = ,XF86AudioPause, exec, playerctl play-pause
bindl = ,XF86AudioPlay, exec, playerctl play-pause
bindl = ,XF86AudioPrev, exec, playerctl previous

bindl = ,XF86AudioMedia, exec, swaync-client -d -sw

gesture = 3, horizontal, workspace

# bindl = , switch:on:Lid Switch, exec, hyprctl keyword monitor "eDP-1, disable"
# bindl = , switch:off:Lid Switch, exec, hyprctl keyword monitor "eDP-1, highres, 0x0, 1.5"

##############################
### WINDOWS AND WORKSPACES ###
##############################

source = ~/.config/hypr/workspaces.conf

windowrule = match:class ^(Bitwarden)$, float on, center on, size 1000 800
windowrule = match:class ^(xdg-desktop-portal-gtk)$, float on, center on, size 1000 800
windowrule = match:class ^(org\.signal\.Signal)$, float on, center on, size 1000 800

windowrule = match:class .*, suppress_event maximize

windowrule = match:class ^$, match:title ^$, no_blur on

# Fix some dragging issues with XWayland
windowrule = match:class ^$, match:title ^$, match:xwayland true, match:float true, match:fullscreen false, match:pin false, no_focus on

# fuck x11
xwayland {
    force_zero_scaling = true
}
